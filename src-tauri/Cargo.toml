[package]
name = "ffmpeg-studio"
version = "0.1.0"
description = "FFmpeg Studio — 可视化音视频处理工作台"
authors = ["you"]
edition = "2021"

[lib]
name = "ffmpeg_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[features]
# default features for tauri
default = []
custom-protocol = ["tauri/custom-protocol"]
